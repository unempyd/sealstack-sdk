[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sealstack"
version = "0.1.4"
description = "Cryptographically verifiable audit trails for AI agents: signed action records, hash-chained runtimes, server receipts, offline verification."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{name = "Brian Keeny", email = "SealStack@icloud.com"}]
maintainers = [{name = "Brian Keeny", email = "SealStack@icloud.com"}]
keywords = [
    "ai-agents",
    "audit-trail",
    "audit-log",
    "ed25519",
    "tamper-evident",
    "hash-chain",
    "receipts",
    "offline-verification",
    "aerf",
    "agent-receipts",
    "scitt",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

dependencies = [
    "cryptography",
    "rfc8785",
    "httpx",
]

[project.optional-dependencies]
reference-server = [
    "fastapi",
    "uvicorn",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "fastapi",
    "uvicorn",
    "httpx",
]

[project.urls]
Homepage = "https://github.com/unempyd/sealstack-sdk"
Repository = "https://github.com/unempyd/sealstack-sdk"
Issues = "https://github.com/unempyd/sealstack-sdk/issues"
Changes = "https://github.com/unempyd/sealstack-sdk/releases"
Security = "https://github.com/unempyd/sealstack-sdk/blob/main/SECURITY.md"
Compatibility = "https://github.com/unempyd/sealstack-sdk/blob/main/COMPATIBILITY.md"

[project.scripts]
sealstack = "sealstack.cli:main"
# ``product`` was the command before 0.1.3; it is kept as an alias.
product = "sealstack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sdk/sealstack", "sdk/product"]

[tool.hatch.build.targets.sdist]
only-include = [
    "sdk/sealstack",
    "sdk/product",
    "pyproject.toml",
    "README.md",
    "LICENSE",
    "COMPATIBILITY.md",
    "DEVIATIONS.md",
    "SECURITY.md",
    "SPEC-RECEIPT.md",
]
exclude = ["**/__pycache__", ".gitignore"]

[tool.pytest.ini_options]
pythonpath = ["sdk", "sdk/tests"]
testpaths = ["sdk/tests", "reference-server/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["sdk", "reference-server"]

[tool.ruff.lint.per-file-ignores]
# sdk/tests/ is copied from the SealStack source repository by its
# scripts/export-sdk.sh. Those files are reproduced as they are there, so
# their import order and constructor style are not adjusted for this tree.
"sdk/tests/*" = ["C408", "I001"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["sdk", "reference-server"]
