name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly: detect upstream verifier drift between pushes

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q sdk/tests reference-server/tests

  # Reproduces COMPATIBILITY.md with the upstream verifiers themselves, so the
  # interoperability claims are checked on every push rather than on one
  # machine. Versions are pinned to what COMPATIBILITY.md names; bump them
  # together with that document.
  interop:
    runs-on: ubuntu-latest
    env:
      AERF_TAG: v0.1.0-draft.1
      AERF_MAIN_COMMIT: 59fce60fe30bde35318812f502a55ab4bace4650
      OBSIGNA_VERSION: "0.16.0"
      NOA_COMMIT: 025ee2cc25eea8e37c680af36561ce45ef2ca577
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install the SDK
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Build the AERF Go verifier at the targeted tag
        run: |
          git clone -q --depth 1 --branch "$AERF_TAG" https://github.com/aerf-spec/aerf.git aerf-tag
          (cd aerf-tag/verifiers/go && go build -o "$GITHUB_WORKSPACE/aerf-verify-v01" .)
      - name: Build the AERF Go verifier at the audited main-branch commit
        run: |
          git clone -q https://github.com/aerf-spec/aerf.git aerf-main
          (cd aerf-main && git checkout -q "$AERF_MAIN_COMMIT")
          (cd aerf-main/verifiers/go && go build -o "$GITHUB_WORKSPACE/aerf-verify-main" ./cmd/aerf-verify)
      - name: Install the Agent Receipts reference SDK
        run: python -m venv obsigna && obsigna/bin/pip install -q "obsigna==$OBSIGNA_VERSION"
      - name: Fetch the noa reference verifier
        run: |
          git clone -q https://github.com/NordenSoft/noa-mandate-core.git noa
          (cd noa && git checkout -q "$NOA_COMMIT")
      - name: Run the interoperability tests against the upstream verifiers
        env:
          AERF_VERIFY_V01: ${{ github.workspace }}/aerf-verify-v01
          AERF_VERIFY: ${{ github.workspace }}/aerf-verify-main
          OBSIGNA_PYTHON: ${{ github.workspace }}/obsigna/bin/python
          NOA_VERIFY: ${{ github.workspace }}/noa/impl-py/noa_verify.py
        run: python -m pytest -q sdk/tests/test_export_formats.py -k "go_reference or obsigna or noa_reference" -rs
